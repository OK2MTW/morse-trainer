# Headers for the app from the public entry (E2/E3 Pinggy). The app gets a single IP = the real client
# (after realip), so X-Forwarded-For is not passed on in its original form (cannot be forged).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# E3: marker of the public entry (app: administrator only from the home network, "Morse outside" manifest). The client cannot forge it.
proxy_set_header X-Morse-Entry public;
