# Hlavičky pro aplikaci z veřejného vstupu (E2/E3 Pinggy). Aplikace dostane jedinou IP = skutečného klienta
# (po realip), proto se X-Forwarded-For nepřeposílá v původní podobě (nejde podvrhnout).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# E3: značka veřejného vstupu (aplikace: správce jen z domácí sítě, manifest „Morse venku“). Klient ji nepodvrhne.
proxy_set_header X-Morse-Entry public;
