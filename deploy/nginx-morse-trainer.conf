# nginx: TLS + reverzní proxy na waitress (127.0.0.1:8080).
limit_req_zone $binary_remote_addr zone=morse_api:1m rate=10r/s;
# přihlášení a pozvánky – přísněji (hádání hesel / tokenů); aplikace navíc počítá neúspěšné pokusy
limit_req_zone $binary_remote_addr zone=morse_auth:1m rate=12r/m;

# HTTP: jen stažení certifikátu CA, vše ostatní přesměrovat na HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location = /ca.crt {
        alias /etc/morse-trainer/public/morse-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="morse-ca.crt"';
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/morse-trainer/pki/server-chain.crt;
    ssl_certificate_key /etc/morse-trainer/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:morse_tls:1m;

    client_max_body_size 256k;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;

    location = /ca.crt {
        alias /etc/morse-trainer/public/morse-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/api/(login|register|invite/check)$ {
        limit_req zone=morse_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }

    location /api/ {
        limit_req_status 429;
        limit_req zone=morse_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }
}

# ================= E2/E3: veřejný přístup přes Pinggy =================
# Internet → Pinggy (HTTPS, veřejný certifikát) → SSH tunel (odchozí z Pi, šifrovaný)
# → JEN tento vstup 127.0.0.1:8090 (z LAN ani z internetu přímo nedostupný) → waitress 127.0.0.1:8080.
# E3: žádné sdílené heslo – chrání účty aplikace (jen pozvánky, argon2id, limity, blokace IP, správce jen z LAN).
limit_req_zone $binary_remote_addr zone=morse_pub:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=morse_pub_auth:1m rate=6r/m;
# E3: strop přihlášení ze všech IP dohromady (botnet nezahltí Pi hashováním argon2)
limit_req_zone $server_port zone=morse_pub_auth_all:64k rate=20r/m;
limit_conn_zone $binary_remote_addr zone=morse_pub_conn:1m;
limit_conn_zone $server_port zone=morse_pub_conn_all:64k;
log_format morse_pub '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'xff="$http_x_forwarded_for" host="$host" ua="$http_user_agent"';
# Povolené veřejné jméno (Host) – soubor vytvoří deploy/pinggy-setup.sh z /etc/morse-trainer/site.env.
# Jiné jméno = spojení se zavře bez odpovědi (444).
map $host $morse_pub_host_ok {
    default 0;
    include /etc/morse-trainer/pinggy-host.map;
}

server {
    listen 127.0.0.1:8090;
    server_name _;
    server_tokens off;

    # skutečná IP klienta: Pinggy ji posílá v X-Forwarded-For; věříme jen tunelu (localhost), bere se poslední položka
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    access_log /var/log/nginx/morse-pinggy.log morse_pub;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_conn morse_pub_conn 20;
    limit_conn morse_pub_conn_all 80;
    limit_conn_status 429;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($morse_pub_host_ok = 0) { return 444; }

    location = /ca.crt { return 404; }   # domácí CA ven nepatří

    location ~ ^/api/(login|register|invite/check)$ {
        limit_req zone=morse_pub_auth burst=5 nodelay;
        limit_req zone=morse_pub_auth_all burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }

    location /api/ {
        limit_req zone=morse_pub burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }

    location / {
        limit_req zone=morse_pub burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }
}
