# SPDX-License-Identifier: EUPL-1.2
# nginx: TLS + reverse proxy to waitress (127.0.0.1:8080).
limit_req_zone $binary_remote_addr zone=morse_api:1m rate=10r/s;
# login and invitations – stricter (guessing passwords / tokens); the app also counts failed attempts
limit_req_zone $binary_remote_addr zone=morse_auth:1m rate=12r/m;

# HTTP: only the CA certificate download, everything else redirected to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location = /ca.crt {
        alias /etc/morse-trainer/public/morse-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="morse-ca.crt"';
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/morse-trainer/pki/server-chain.crt;
    ssl_certificate_key /etc/morse-trainer/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:morse_tls:1m;

    client_max_body_size 256k;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;
    # 0.10.18 (Z-19): a limit hit by nginx answers with a short JSON (the client keeps the lesson and retries later);
    # 429 answers of the app itself pass through unchanged (proxy_intercept_errors is off)
    error_page 429 @busy;
    location @busy {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"busy":true,"retry":10}\n';
    }

    location = /ca.crt {
        alias /etc/morse-trainer/public/morse-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/api/(login|register|invite/check)$ {
        limit_req zone=morse_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }

    location /api/ {
        limit_req_status 429;
        limit_req zone=morse_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Morse-Entry "";
    }
}

# ================= E2/E3: public access via Pinggy =================
# Internet → Pinggy (HTTPS, public certificate) → SSH tunnel (outgoing from the Pi, encrypted)
# → ONLY this entry 127.0.0.1:8090 (not directly reachable from the LAN or the internet) → waitress 127.0.0.1:8080.
# E3: no shared password – protected by the app accounts (invitations only, argon2id, limits, IP blocking, admin only from the LAN).
limit_req_zone $binary_remote_addr zone=morse_pub:1m rate=5r/s;
# 0.9.4: the API has its own zone – one page load (~40 files) used up the shared zone and GET /api/me got 429,
# which the app showed as "logged out" (docs: validation #9)
limit_req_zone $binary_remote_addr zone=morse_pub_api:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=morse_pub_auth:1m rate=6r/m;
# E3: a cap on logins from all IPs together (a botnet cannot flood the Pi with argon2 hashing)
limit_req_zone $server_port zone=morse_pub_auth_all:64k rate=20r/m;
limit_conn_zone $binary_remote_addr zone=morse_pub_conn:1m;
limit_conn_zone $server_port zone=morse_pub_conn_all:64k;
# 0.10.18 (Z-19, docs/kapacita.md): a cap on API requests from all IPs together – a crowd of clients (or a tunnel
# full of bots) cannot queue more work than the single Python thread serves (~6–27 req/s by history length)
limit_req_zone $server_port zone=morse_pub_api_all:64k rate=40r/s;
log_format morse_pub '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'xff="$http_x_forwarded_for" host="$host" ua="$http_user_agent"';
# Allowed public name (Host) – the file is created by deploy/pinggy-setup.sh from /etc/morse-trainer/site.env.
# Another name = the connection is closed without a response (444).
map $host $morse_pub_host_ok {
    default 0;
    include /etc/morse-trainer/pinggy-host.map;
}

server {
    listen 127.0.0.1:8090;
    server_name _;
    server_tokens off;

    # the real client IP: Pinggy sends it in X-Forwarded-For; only the tunnel (localhost) is trusted, the last item is taken
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    access_log /var/log/nginx/morse-pinggy.log morse_pub;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    # 0.10.18 (Z-19): idle browsers release their connection sooner (default 75 s) → the cap on all connections
    # can be higher; Z-21: compression also outside (first load 534 kB uncompressed before)
    keepalive_timeout 20s;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json;
    limit_conn morse_pub_conn 20;
    limit_conn morse_pub_conn_all 150;
    limit_conn_status 429;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 429 @busy;
    location @busy {
        default_type application/json;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Retry-After 10 always;
        return 429 '{"busy":true,"retry":10}\n';
    }

    if ($morse_pub_host_ok = 0) { return 444; }

    location = /ca.crt { return 404; }   # the home CA does not belong outside

    location ~ ^/api/(login|register|invite/check)$ {
        limit_req zone=morse_pub_auth burst=5 nodelay;
        limit_req zone=morse_pub_auth_all burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }

    location /api/ {
        limit_req zone=morse_pub_api burst=30 nodelay;
        limit_req zone=morse_pub_api_all burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }

    location / {
        limit_req zone=morse_pub burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/morse-trainer/pinggy-proxy.conf;
    }
}
